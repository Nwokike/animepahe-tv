[project]
name = "animepahe-tv"
version = "1.0.9"
description = "Lightweight client-side Android TV / mobile / desktop app for streaming anime from AnimePahe."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flet-yandex-ads>=0.1.0",
    "flet-notifications>=0.1.3",
    "primp>=1.3.1",
    "anyio>=4.14.1",
    "flet>=0.85.3",
    "flet-webview>=0.85.3",
    "flet-video>=0.85.3",
]

[tool.flet]
org = "com.animepahe"
product = "AnimePahe TV"
build_number = 10

[tool.flet.app]
path = "src"

[tool.flet.android]
bundle_id = "com.animepahe.tv"
dependencies = ["pyjnius"]

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true
"android.permission.WAKE_LOCK" = true

[tool.flet.android.feature]
"android.software.leanback" = true
"android.hardware.touchscreen" = false

[dependency-groups]
dev = [
    "ruff>=0.15.13",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pywebview>=6.2.1",
    "qtpy>=2.4.3",
    "pyqt6-webengine>=6.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_test_loop_scope = "function"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "asyncio: run the test in an asyncio event loop (pytest-asyncio, strict mode)",
]
filterwarnings = [
    "error::pytest.PytestDeprecationWarning",
]
log_cli = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
ignore = ["E501"]


