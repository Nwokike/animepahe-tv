[project]
name = "animepahe-tv"
version = "1.0.9"
description = "Lightweight client-side Android TV / mobile / desktop app for streaming anime from AnimePahe."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flet==1.0.4",
    "flet-video==1.0.4",
    "flet-webview-all>=0.2.1",
    "primp>=1.3.1",
]

[tool.flet]
org = "com.animepahe"
product = "AnimePahe TV"
build_number = 10

[tool.flet.app]
path = "src"

[tool.flet.android]
bundle_id = "com.animepahe.tv"
dependencies = ["pyjnius"]

# Signing is done by CI from repository secrets (KEYSTORE_BASE64, KEY_ALIAS,
# KEYSTORE_PASSWORD, KEY_PASSWORD) via the FLET_ANDROID_SIGNING_* env vars.
# Never commit keystore paths or passwords here.

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true
"android.permission.WAKE_LOCK" = true

[tool.flet.android.feature]
"android.software.leanback" = true
"android.hardware.touchscreen" = false

[dependency-groups]
dev = [
    "ruff>=0.15.13",
]


