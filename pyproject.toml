[project]
name = "animepahe-tv"
version = "1.0.7"
description = "Lightweight client-side Android TV / mobile / desktop app for streaming anime from AnimePahe."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "beautifulsoup4>=4.12.0",
    "flet==0.85.0",
    "flet-webview==0.85.0",
    "primp>=1.3.1",
]

[tool.flet]
org = "com.animepahe"
product = "AnimePahe TV"
build_number = 8

[tool.flet.app]
path = "src"

[tool.flet.android]
bundle_id = "com.animepahe.tv"
dependencies = ["pyjnius"]

[tool.flet.android.signing]
key_store = "../../../../tv_keystore.jks"
key_alias = "livescore"
key_store_password = "Maikel1@"
key_password = "Maikel1@"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true
"android.permission.WAKE_LOCK" = true

[tool.flet.android.feature]
"android.software.leanback" = true
"android.hardware.touchscreen" = false

[dependency-groups]
dev = [
    "ruff>=0.15.13",
    "pywebview>=6.2.1",
    "qtpy>=2.4.3",
    "pyqt6-webengine>=6.11.0",
]


