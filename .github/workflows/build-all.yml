name: Build Android APKs & Create Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_version:
        description: "Build version"
        required: true
        default: "1.0.9"
      build_number:
        description: "Build number"
        required: true
        default: "10"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"
  UV_PYTHON: "3.14"
  # Tag pushes carry the version (v1.2.3 -> 1.2.3, build number = UTC date
  # stamp, monotonic without a counter to bump by hand); manual dispatches
  # keep their explicit inputs.
  BUILD_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.build_version || '1.0.9' }}
  BUILD_NUMBER: ${{ startsWith(github.ref, 'refs/tags/v') && github.run_number || inputs.build_number || '10' }}

jobs:
  # ─── 0. Create Release Tag & Placeholder ───────────────
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      TAG_NAME: ${{ steps.tag_info.outputs.TAG_NAME }}
      RELEASE_NAME: ${{ steps.tag_info.outputs.RELEASE_NAME }}
      IS_PRERELEASE: ${{ steps.tag_info.outputs.IS_PRERELEASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate Release Tag & Name
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=AnimePahe TV ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "TAG_NAME=build-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=Automated Build (${SHORT_SHA})" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          fi
      - name: Create GitHub Release Placeholder (private)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG_NAME }}
          name: ${{ steps.tag_info.outputs.RELEASE_NAME }}
          prerelease: ${{ steps.tag_info.outputs.IS_PRERELEASE }}
          make_latest: true
          body: |
            Automated multi-platform build generated from commit `${{ github.sha }}`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Public Release Placeholder (optional mirror)
        # The public mirror needs its own PAT; without it the build and
        # the private release must still run (2026-10-16: a missing
        # token failed prepare-release and produced no APK at all).
        # Add the RELEASE_PAT secret to restore the mirror.
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAG: ${{ steps.tag_info.outputs.TAG_NAME }}
          NAME: ${{ steps.tag_info.outputs.RELEASE_NAME }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "RELEASE_PAT is not set — skipping the public mirror."
            exit 0
          fi
          gh release create "$TAG" --repo soco-live/animepahe-releases \
            --title "$NAME" --notes "Automated build from $GITHUB_SHA" \
            || gh release edit "$TAG" --repo soco-live/animepahe-releases --title "$NAME"

  # ─── 1. Android APK (universal) ───────────────────────────
  build-apk:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: sudo rm -rf /opt/hostedtoolcache/* /usr/share/dotnet /usr/local/lib/android/sdk/ndk/26* 2>/dev/null || true; df -h
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > tv_keystore.jks
      # ── Notifications need things pyproject cannot express (Sherlock's
      # proven three-phase recipe, mirrored here): `flet build apk` stops
      # at :app:checkReleaseAarMetadata because flutter_local_notifications
      # (flet-notifications' Dart half) requires core-library desugaring.
      #   1. generate the project (Gradle is expected to fail HERE only)
      #   2. flet-notifications-patch injects desugaring + the receivers
      #   3. build again — the patch survives, and --split-per-abi (or the
      #      universal pass) is honoured.
      - name: Generate the Android project
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/tv_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          uv run flet build apk --yes --project animepahe-tv --product "AnimePahe TV" --org com.animepahe --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} -v
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "flet build apk completed on the first pass; no patch required."
          elif [ -f build/flutter/android/app/build.gradle.kts ]; then
            echo "::warning::flet build apk stopped at its Gradle run (expected: core library desugaring missing). Project generated; patching and re-running."
          else
            echo "::error::flet build apk failed before generating the Android project"
            exit 1
          fi
      - name: Patch the generated Android project (notifications)
        run: uv run flet-notifications-patch --project-root build/flutter
      - name: Build APK (universal)
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/tv_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # A Gradle build can be SIGTERM'd by the runner (exit 143) when
          # two Android builds share the machine — one bounded retry heals
          # that without serializing the jobs. The 45-min timeout turns a
          # HUNG Gradle into a fast failure the retry can act on (the
          # universal job once spun for an hour doing nothing, 2026-10-16).
          for attempt in 1 2; do
            timeout 2700 uv run flet build apk --yes --project animepahe-tv --product "AnimePahe TV" --org com.animepahe --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} -v && break
            echo "::warning::universal build attempt $attempt failed — retrying"
          done
      - name: Upload to Private Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: build/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload to Public Release Repo (optional mirror)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAG: ${{ needs.prepare-release.outputs.TAG_NAME }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "RELEASE_PAT is not set — mirror upload skipped (the private release has the APK)."
            exit 0
          fi
          gh release upload "$TAG" build/apk/*.apk --repo soco-live/animepahe-releases --clobber

  # ─── 2. Android APK (split per ABI) ───────────────────────
  build-apk-split:
    # PARALLEL with build-apk (the house pattern in Sherlock/DDGS: every
    # build job needs only prepare-release). It used to `needs: build-apk`
    # — the universal APK had to FINISH before the split build started,
    # doubling the wall-clock wait for no dependency at all (the owner's
    # report, 2026-10-16). The two write different file sets into the same
    # release, so they cannot collide.
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: sudo rm -rf /opt/hostedtoolcache/* /usr/share/dotnet /usr/local/lib/android/sdk/ndk/26* 2>/dev/null || true; df -h
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > tv_keystore.jks
      # Same three-phase recipe as the universal job (Sherlock's pattern).
      - name: Generate the Android project
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/tv_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          uv run flet build apk --yes --project animepahe-tv --product "AnimePahe TV" --org com.animepahe --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} --split-per-abi -v
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "flet build apk completed on the first pass; no patch required."
          elif [ -f build/flutter/android/app/build.gradle.kts ]; then
            echo "::warning::flet build apk stopped at its Gradle run (expected: core library desugaring missing). Project generated; patching and re-running."
          else
            echo "::error::flet build apk failed before generating the Android project"
            exit 1
          fi
      - name: Patch the generated Android project (notifications)
        run: uv run flet-notifications-patch --project-root build/flutter
      - name: Build APK (split per ABI)
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/tv_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for attempt in 1 2; do
            timeout 2700 uv run flet build apk --yes --project animepahe-tv --product "AnimePahe TV" --org com.animepahe --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} --split-per-abi -v && break
            echo "::warning::split build attempt $attempt failed — retrying"
          done
      - name: Upload to Private Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: build/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload to Public Release Repo (optional mirror)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAG: ${{ needs.prepare-release.outputs.TAG_NAME }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "RELEASE_PAT is not set — mirror upload skipped (the private release has the APK)."
            exit 0
          fi
          gh release upload "$TAG" build/apk/*.apk --repo soco-live/animepahe-releases --clobber
