name: Build Android APKs & Create Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_version:
        description: "Build version"
        required: true
        default: "2.0.0"
      build_number:
        description: "Build number"
        required: true
        default: "20"

permissions:
  contents: write

# A superseded run must not queue behind a long build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"
  UV_PYTHON: "3.14"
  BUILD_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.build_version || '2.0.0' }}
  BUILD_NUMBER: ${{ startsWith(github.ref, 'refs/tags/v') && github.run_number || inputs.build_number || '20' }}

jobs:
  # ─── 0. Create Release Tag & Placeholder ────────────
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      TAG_NAME: ${{ steps.tag_info.outputs.TAG_NAME }}
      RELEASE_NAME: ${{ steps.tag_info.outputs.RELEASE_NAME }}
      IS_PRERELEASE: ${{ steps.tag_info.outputs.IS_PRERELEASE }}
    steps:
      - uses: actions/checkout@v7
      - name: Generate Release Tag & Name
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=AnimePahe TV ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "TAG_NAME=build-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=Automated Build (${SHORT_SHA})" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          fi
      - name: Create GitHub Release Placeholder (private)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG_NAME }}
          name: ${{ steps.tag_info.outputs.RELEASE_NAME }}
          prerelease: ${{ steps.tag_info.outputs.IS_PRERELEASE }}
          make_latest: true
          body: |
            Automated multi-platform build generated from commit `${{ github.sha }}`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Public Release Placeholder (optional mirror)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAG: ${{ steps.tag_info.outputs.TAG_NAME }}
          NAME: ${{ steps.tag_info.outputs.RELEASE_NAME }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "RELEASE_PAT is not set — skipping the public mirror."
            exit 0
          fi
          gh release create "$TAG" --repo soco-live/animepahe-releases \
            --title "$NAME" --notes "Automated build from $GITHUB_SHA" \
            || gh release edit "$TAG" --repo soco-live/animepahe-releases --title "$NAME"

  # ─── Android APK (split per ABI) ──────────────────────────────────────────
  build-apk-split:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # ── Caches ────────────────────────────────────────────────────────────
      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-
      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: flutter-${{ runner.os }}-
      - name: Cache flet templates
        uses: actions/cache@v4
        with:
          path: ~/.flet/cache
          key: flet-tpl-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: flet-tpl-${{ runner.os }}-
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ runner.os }}-flet-0.85.3
          restore-keys: gradle-${{ runner.os }}-flet-
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > tv_keystore.jks
      # ── Phase 1: generate the Android project ─────────────────────────────
      # flet build runs Gradle once itself; it stops at checkReleaseAarMetadata
      # (expected — flutter_local_notifications needs core-library desugaring).
      # The Android project and the packaged Python app.zip are fully written
      # by that point, so we let it stop, patch what needs patching, then
      # drive Gradle directly in Phase 3 to skip re-packaging everything.
      - name: Generate the Android project
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/tv_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          uv run flet build apk --yes --project animepahe-tv --product "AnimePahe TV" --org com.animepahe --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} --split-per-abi -v
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "flet build apk completed on the first pass; no patch required."
          elif [ -f build/flutter/android/app/build.gradle.kts ]; then
            echo "::warning::flet build apk stopped at its Gradle run (expected: core library desugaring missing). Project generated; patching and re-running."
          else
            echo "::error::flet build apk failed before generating the Android project"
            exit 1
          fi
      # ── Phase 2: patch desugaring + notifications + KTV queries ───────────
      - name: Patch the generated Android project (notifications & KTV queries)
        run: |
          uv run flet-notifications-patch --project-root build/flutter
          manifest="build/flutter/android/app/src/main/AndroidManifest.xml"
          if [ -f "$manifest" ] && ! grep -q 'scheme="ktv"' "$manifest"; then
            sed -i '/<\/manifest>/i \    <queries>\n        <package android:name="ng.kiri.ktvplayer" \/>\n        <intent>\n            <action android:name="android.intent.action.VIEW" \/>\n            <data android:scheme="ktv" \/>\n        <\/intent>\n    <\/queries>' "$manifest"
            echo "Injected KTV player queries into AndroidManifest.xml"
          fi
      # ── Phase 3: drive Gradle directly ────────────────────────────────────
      # flet-cli 0.85.3 has no app.zip hash-check to skip re-packaging on the
      # second run, so calling `flet build apk` again would re-package Python
      # for every ABI from scratch before Gradle even starts — that's the step
      # that took 13+ minutes and got SIGTERM'd in run 40107570439.
      # The Python app was already packaged in Phase 1 (app.zip + .hash written)
      # and the Gradle project was patched in Phase 2, so all Gradle needs is
      # to compile and sign.
      - name: Build APK (split per ABI)
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/tv_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p build/apk
          cd build/flutter
          ./gradlew assembleRelease --no-daemon \
            -Psplit-per-abi \
            "-Pandroid.injected.signing.store.file=${{ github.workspace }}/tv_keystore.jks" \
            "-Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }}" \
            "-Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }}" \
            "-Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}"
          cd "${{ github.workspace }}"
          find build/flutter/build/app/outputs/flutter-apk/ -name "*.apk" ! -name "*unsigned*" \
            -exec cp {} build/apk/ \;
      - name: Size report
        if: always()
        run: |
          ls -l build/apk/*.apk 2>/dev/null || echo "No APKs found"
          for a in build/apk/*.apk; do
            [ -f "$a" ] && echo "== $a ($(du -h "$a" | cut -f1))"
          done
      - name: Upload to Private Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: build/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload to Public Release Repo (optional mirror)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAG: ${{ needs.prepare-release.outputs.TAG_NAME }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "RELEASE_PAT is not set — mirror upload skipped (the private release has the APK)."
            exit 0
          fi
          gh release upload "$TAG" build/apk/*.apk --repo soco-live/animepahe-releases --clobber
